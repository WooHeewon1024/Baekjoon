<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Sun Direction App Architecture</title>
  <desc id="desc">Architecture diagram showing App, MainFrame, GeocodingService, SunCalculator and SunCompassPanel data flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1f3a"/>
      <stop offset="100%" stop-color="#203e73"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2d4d"/>
      <stop offset="100%" stop-color="#294d81"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#193052"/>
      <stop offset="100%" stop-color="#315b91"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#08111f" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#ffd55a"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', sans-serif; fill: #f7fbff; }
      .subtitle { font: 400 17px 'Segoe UI', sans-serif; fill: #d8e6ff; }
      .section { font: 700 22px 'Segoe UI', sans-serif; fill: #ffffff; }
      .label { font: 700 20px 'Segoe UI', sans-serif; fill: #ffffff; }
      .body { font: 400 16px 'Segoe UI', sans-serif; fill: #d9e8ff; }
      .small { font: 400 14px 'Segoe UI', sans-serif; fill: #c9dbff; }
      .flow { font: 600 16px 'Segoe UI', sans-serif; fill: #ffe7a0; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="58" fill="#ffd447" opacity="0.95"/>
  <circle cx="1040" cy="120" r="88" fill="#ffd447" opacity="0.14"/>

  <text x="70" y="78" class="title">Sun Direction App</text>
  <text x="70" y="112" class="subtitle">Real-time sunlight direction visualization from city input to solar math to compass rendering</text>

  <rect x="430" y="150" rx="26" ry="26" width="340" height="110" fill="url(#card)" filter="url(#shadow)"/>
  <text x="600" y="196" text-anchor="middle" class="label">App.java</text>
  <text x="600" y="228" text-anchor="middle" class="body">main() starts Swing UI and opens MainFrame</text>

  <rect x="300" y="315" rx="28" ry="28" width="600" height="180" fill="url(#panel)" filter="url(#shadow)"/>
  <text x="600" y="365" text-anchor="middle" class="label">MainFrame.java</text>
  <text x="600" y="400" text-anchor="middle" class="body">User input, search button, status labels, 10-second timer</text>
  <text x="600" y="432" text-anchor="middle" class="body">Coordinates loaded here, then the sun position is recalculated</text>
  <text x="600" y="464" text-anchor="middle" class="small">Acts as the controller for the whole app</text>

  <rect x="80" y="585" rx="24" ry="24" width="300" height="175" fill="url(#card)" filter="url(#shadow)"/>
  <text x="230" y="633" text-anchor="middle" class="label">GeocodingService.java</text>
  <text x="230" y="668" text-anchor="middle" class="body">Calls Nominatim API</text>
  <text x="230" y="698" text-anchor="middle" class="body">city name → latitude / longitude</text>
  <text x="230" y="728" text-anchor="middle" class="small">Requires internet connection</text>

  <rect x="450" y="585" rx="24" ry="24" width="300" height="175" fill="url(#card)" filter="url(#shadow)"/>
  <text x="600" y="633" text-anchor="middle" class="label">SunCalculator.java</text>
  <text x="600" y="668" text-anchor="middle" class="body">NOAA-style solar position algorithm</text>
  <text x="600" y="698" text-anchor="middle" class="body">UTC + lat/lon → azimuth + elevation</text>
  <text x="600" y="728" text-anchor="middle" class="small">Julian date, declination, hour angle</text>

  <rect x="820" y="585" rx="24" ry="24" width="300" height="175" fill="url(#card)" filter="url(#shadow)"/>
  <text x="970" y="633" text-anchor="middle" class="label">SunCompassPanel.java</text>
  <text x="970" y="668" text-anchor="middle" class="body">Draws compass, sun icon, sky rings</text>
  <text x="970" y="698" text-anchor="middle" class="body">Day/night rendering from solar elevation</text>
  <text x="970" y="728" text-anchor="middle" class="small">Custom Swing paintComponent()</text>

  <path d="M600 260 L600 315" stroke="#ffd55a" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M430 440 C330 470, 255 520, 230 585" stroke="#ffd55a" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M600 495 L600 585" stroke="#ffd55a" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M770 440 C870 470, 945 520, 970 585" stroke="#ffd55a" stroke-width="5" fill="none" marker-end="url(#arrow)"/>

  <text x="625" y="295" class="flow">Launch UI</text>
  <text x="165" y="535" class="flow">Resolve city</text>
  <text x="620" y="545" class="flow">Compute sun position</text>
  <text x="920" y="535" class="flow">Render sky compass</text>

  <rect x="70" y="800" rx="20" ry="20" width="1060" height="60" fill="#10233f" opacity="0.88"/>
  <text x="600" y="836" text-anchor="middle" class="body">Flow: user enters city → coordinates resolved → solar position calculated every 10 seconds → compass repaints with the latest sunlight direction</text>
</svg>