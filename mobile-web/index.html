<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffb703" />
  <title>Sun Direction Mobile</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="../assets/sun-direction-icon.png" />
  <link rel="apple-touch-icon" href="../assets/sun-direction-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-shape bg-shape-a"></div>
  <div class="bg-shape bg-shape-b"></div>

  <main class="app-wrap">
    <header class="app-header">
      <h1>Sun Direction</h1>
      <p>실시간 햇빛 방향 · 모바일 버전</p>
    </header>

    <section class="control-card">
      <div class="row">
        <input id="cityInput" type="text" placeholder="도시 이름 입력 (예: 서울)" />
        <button id="searchBtn">검색</button>
      </div>
      <div class="row two">
        <button id="gpsBtn" class="secondary">현재 위치 사용</button>
        <button id="installBtn" class="secondary hidden">앱 설치</button>
      </div>
      <p id="statusText" class="status">도시를 검색하거나 현재 위치를 사용하세요.</p>
    </section>

    <section class="compass-card">
      <canvas id="compassCanvas" width="360" height="360" aria-label="태양 나침반"></canvas>
    </section>

    <section class="info-card">
      <p id="locationText">위치: -</p>
      <p id="sunText">방위각: - | 고도: - | 방향: -</p>
      <p id="timeText">업데이트: -</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
